# Production stack for the game server VPS: Caddy (HTTPS, reverse proxy) + Bugshop server.
# Usage: cp .env.example .env && edit, then `docker compose up -d --build` from this folder.
services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in deploy/.env}
      # Accounts. Sign-in redirects come back to the API domain.
      PUBLIC_URL: https://${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in deploy/.env}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in deploy/.env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in deploy/.env}
      # Optional sign-in providers (an empty value means "off").
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      # Site banner, written by the private admin dashboard (never public).
      ANNOUNCEMENT_PATH: /announce/announcement.json
    # Internal network only. Never add `ports:` here: the server trusts the
    # X-Real-IP header that Caddy sets, so it must not be reachable directly.
    expose:
      - "2567"
    # The filesystem is read-only except for the database volume.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - bugshop_data:/data
      # Read-only: the game server only reads the banner; the admin dashboard writes it.
      - bugshop_announce:/announce:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    # Logs contain IP addresses: rotate them so they are kept for days, not forever
    # (the Privacy Policy relies on this).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      - server
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # Logs contain IP addresses: rotate them so they are kept for days, not forever
    # (the Privacy Policy relies on this).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bugshop_data:
  # Fixed name so the separate admin dashboard stack can mount it (as external).
  bugshop_announce:
    name: bugshop_announce
  caddy_data:
  caddy_config:
