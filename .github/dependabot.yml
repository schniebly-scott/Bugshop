version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge: don't propose versions younger than 14 days.
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Types must match the Node 24 runtime; move majors together with the image (see below).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on Node 24 LTS (supported until April 2028). Node 25+ drops corepack,
      # which the Dockerfile uses for pnpm, so a major upgrade needs a manual change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
