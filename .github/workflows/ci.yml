name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned by commit SHA (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bugshop/web build
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build server image (not pushed)
        run: docker build -f apps/server/Dockerfile -t bugshop-server:ci .
      - name: Image starts and refuses to run without its required settings
        # Placeholder values only: nothing here is a real secret.
        run: |
          ! docker run --rm bugshop-server:ci
          ! docker run --rm -e ALLOWED_ORIGINS=https://example.com bugshop-server:ci
          docker run -d --name bugshop-ci --read-only --tmpfs /tmp \
            -e ALLOWED_ORIGINS=https://example.com \
            -e PUBLIC_URL=https://api.example.com \
            -e AUTH_SECRET=ci-placeholder-secret-not-used-anywhere-else \
            -e RESEND_API_KEY=ci-placeholder \
            -e "MAIL_FROM=Bugshop <ci@example.com>" \
            bugshop-server:ci
          sleep 3
          docker logs bugshop-ci | grep -q "listening"
          [ "$(docker exec bugshop-ci id -u)" != "0" ]  # runs as non-root
